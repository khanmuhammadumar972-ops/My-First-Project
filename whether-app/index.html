<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<style>
  body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .card{
    width:350px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
  }

  h1{
    margin-top:0;
    color:#333;
  }

  input{
    width:70%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
  }

  button{
    padding:12px 18px;
    border:none;
    background:#0072ff;
    color:white;
    border-radius:8px;
    cursor:pointer;
  }

  button:hover{
    background:#0057c7;
  }

  #result{
    margin-top:25px;
    font-size:20px;
    color:#333;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Weather App</h1>

  <input id="city" placeholder="Enter city name">
  <button onclick="getWeather()">Search</button>

  <div id="result"></div>
</div>

<script src="index.js"></script>
</body>
</html>
